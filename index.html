<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Tienda de Diana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --azul:#0a7fd4; --azul-osc:#0b3d91; --azul-cl:#e8f3fc; --amar:#ffd400; --rojo:#e60012;
  --verde:#16a34a; --gris:#64748b; --borde:#d9e4ee; --fondo:#eef5fb;
  --fuente:'Fredoka','Segoe UI',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{font-family:var(--fuente);background:var(--fondo);color:#13233a;font-size:16px}
button{font-family:inherit;cursor:pointer;border:0}
input,select{font-family:inherit;font-size:16px}
input,select{width:100%;padding:11px 13px;border:2px solid var(--borde);border-radius:12px;background:#fff;color:#13233a;outline:none}
input:focus,select:focus{border-color:var(--azul)}
label{display:block;font-weight:500;font-size:14px;color:var(--gris);margin:12px 0 5px}

/* ---------- LOGIN ---------- */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(circle at 20% 10%,#2b9bec 0,var(--azul) 45%,#0765b0 100%)}
.login-box{width:100%;max-width:410px;background:#fff;border-radius:26px;padding:30px 28px 28px;box-shadow:0 20px 50px rgba(5,40,90,.35)}
.logo{text-align:center;line-height:1;margin-bottom:6px}
.logo .cart{font-size:54px;display:block;margin-bottom:6px}
.logo .la,.logo .tienda{font-weight:700;color:#fff;-webkit-text-stroke:7px var(--azul-osc);paint-order:stroke fill;text-shadow:0 3px 0 var(--azul-osc)}
.logo .la{font-size:26px}
.logo .tienda{font-size:44px;display:block}
.logo .de{font-weight:700;font-size:22px;color:#fff;-webkit-text-stroke:5px var(--azul-osc);paint-order:stroke fill}
.logo .diana{display:block;font-size:56px;font-weight:700;color:var(--rojo);-webkit-text-stroke:8px #fff;paint-order:stroke fill;text-shadow:0 3px 0 var(--azul-osc),0 0 0 var(--azul-osc);filter:drop-shadow(0 2px 0 var(--azul-osc))}
.logo-wrap{background:#0182d4;border-radius:20px;overflow:hidden;margin-bottom:18px}
.logo-wrap img{display:block;width:100%;height:auto}
.logo-wrap .logo{margin:0}
.login-box h2{text-align:center;font-size:19px;color:var(--azul-osc);margin-bottom:2px}
.btn{padding:13px 18px;border-radius:14px;font-weight:600;font-size:16px;transition:transform .08s,filter .15s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.6;cursor:wait}
.btn.blue{background:var(--azul);color:#fff}
.btn.green{background:var(--verde);color:#fff}
.btn.yellow{background:var(--amar);color:#3b2f00}
.btn.red{background:var(--rojo);color:#fff}
.btn.ghost{background:#eaf0f6;color:#31475f}
.btn.full{width:100%;margin-top:18px}
.err{background:#fde8ea;color:#a10f1c;border-radius:12px;padding:10px 12px;margin-top:14px;font-size:14px}

/* ---------- APP ---------- */
header{background:var(--azul);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 18px;position:sticky;top:0;z-index:20;box-shadow:0 3px 14px rgba(5,40,90,.25);flex-wrap:wrap}
.brand{font-weight:700;font-size:21px;white-space:nowrap}
.brand img{height:54px;width:auto;display:block;border-radius:10px}
nav{display:flex;gap:6px;flex:1;flex-wrap:wrap}
nav button{background:rgba(255,255,255,.14);color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;font-size:15px}
nav button.on{background:var(--amar);color:#3b2f00}
.hr{display:flex;gap:6px}
.hr button{background:rgba(255,255,255,.14);color:#fff;padding:10px 14px;border-radius:12px;font-weight:600}
main{max-width:1250px;margin:0 auto;padding:18px}
.card{background:#fff;border-radius:20px;padding:18px;box-shadow:0 4px 18px rgba(20,60,110,.08)}
.card h2{font-size:20px;color:var(--azul-osc);margin-bottom:12px}
.cols{display:grid;grid-template-columns:1fr 410px;gap:16px;align-items:start}
.inv{position:sticky;top:78px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:12px}
.prod{background:var(--azul-cl);border:2px solid transparent;border-radius:16px;padding:14px 8px 12px;text-align:center;color:inherit;position:relative;transition:transform .08s,border-color .15s}
.prod:hover{border-color:var(--azul);transform:translateY(-2px)}
.prod:active{transform:scale(.96)}
.prod .ico{font-size:38px;line-height:1.1;display:block}
.prod .nom{font-weight:600;font-size:15px;margin:6px 0 2px;word-break:break-word}
.prod .pre{color:var(--rojo);font-weight:700;font-size:16px}
.prod .badge{position:absolute;top:6px;right:6px;background:var(--rojo);color:#fff;border-radius:999px;min-width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;padding:0 6px}
.vacio{text-align:center;color:var(--gris);padding:26px 10px;font-size:15px;line-height:1.5}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.linea{border:2px solid var(--borde);border-radius:14px;padding:10px;margin-top:10px}
.l-top{display:flex;gap:8px;align-items:center}
.l-top .ico{font-size:26px}
.l-top select{padding:8px 10px;font-size:15px}
.x{background:#fde8ea;color:var(--rojo);border-radius:10px;width:38px;height:38px;font-size:16px;flex:none;font-weight:700}
.l-bot{display:flex;align-items:center;gap:10px;margin-top:8px}
.qty{display:flex;align-items:center;gap:8px;background:var(--azul-cl);border-radius:12px;padding:4px}
.qty button{width:34px;height:34px;border-radius:9px;background:#fff;color:var(--azul-osc);font-size:20px;font-weight:700}
.qty b{min-width:26px;text-align:center}
.pu{color:var(--gris);font-size:14px;flex:1}
.sub{font-size:17px}
.tot{margin-top:14px;border-top:2px dashed var(--borde);padding-top:10px}
.tot div{display:flex;justify-content:space-between;padding:3px 0;color:var(--gris);font-size:15px}
.tot .big{color:var(--azul-osc);font-size:26px;font-weight:700;padding-top:6px}
.tot small{display:block;color:var(--gris);font-size:12px;margin-top:2px}
.acts{display:flex;gap:8px;margin-top:14px}
.acts .btn{flex:1}
.acts .btn.green{flex:2}

/* productos */
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.cat{background:var(--azul-cl);border:2px solid transparent;border-radius:14px;padding:9px 4px;color:#13233a;font-size:13px;font-weight:500;line-height:1.2}
.cat span{display:block;font-size:28px}
.cat.on{border-color:var(--azul);background:#fff;box-shadow:0 0 0 3px rgba(10,127,212,.2)}
.preview{background:var(--azul-cl);border-radius:12px;padding:10px 12px;margin-top:12px;font-size:14px;color:var(--azul-osc);min-height:42px}
.fila{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--borde)}
.fila:last-child{border:0}
.fila .ico{font-size:30px}
.fila .info{flex:1;min-width:0}
.fila .info b{display:block;word-break:break-word}
.fila .info small{color:var(--gris)}
.fila .pr{font-weight:700;color:var(--rojo);font-size:17px;white-space:nowrap}
.mini{padding:8px 12px;border-radius:10px;font-weight:600;font-size:14px}
.mini.e{background:#e0eefb;color:var(--azul-osc)}
.mini.d{background:#fde8ea;color:var(--rojo)}
.stat{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.stat div{background:var(--azul-cl);border-radius:14px;padding:12px 16px;flex:1;min-width:150px}
.stat small{color:var(--gris);display:block}
.stat b{font-size:22px;color:var(--azul-osc)}

/* modal / recibo */
.modal-bg{position:fixed;inset:0;background:rgba(8,25,50,.6);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 12px}
.modal-box{background:#fff;border-radius:20px;padding:20px;width:100%;max-width:440px;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.m-acts{display:flex;gap:8px;margin-top:16px}
.m-acts .btn{flex:1}
.receipt{font-family:'Courier New',monospace;font-size:14px;color:#000}
.r-head{text-align:center;border-bottom:2px dashed #999;padding-bottom:10px;margin-bottom:10px}
.r-head h3{font-family:var(--fuente);font-size:22px}
.r-meta{line-height:1.5;margin-bottom:8px}
.receipt table{width:100%;border-collapse:collapse}
.receipt th{text-align:left;border-bottom:1px solid #000;padding:4px 2px;font-size:12px}
.receipt td{padding:4px 2px;vertical-align:top}
.receipt .n{text-align:right;white-space:nowrap}
.r-tot{border-top:2px dashed #999;margin-top:10px;padding-top:8px}
.r-tot div{display:flex;justify-content:space-between;padding:2px 0}
.r-tot .big{font-size:19px;font-weight:700}
.r-foot{text-align:center;margin-top:12px;font-size:12px;color:#444}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.t{background:#13233a;color:#fff;padding:12px 18px;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:90vw;font-size:15px}
.t.err{background:var(--rojo)}
.t.ok{background:var(--verde)}

@media(max-width:900px){
  .cols{grid-template-columns:1fr}
  .inv{position:static}
  main{padding:12px}
}
@media print{
  body{background:#fff}
  body>*:not(#modal){display:none!important}
  .modal-bg{position:static;background:none;padding:0;display:block}
  .modal-box{box-shadow:none;padding:0;max-width:none}
  .no-print{display:none!important}
}
</style>
</head>

<script>
/* ================== CONFIGURACIÓN ================== */
const SUPABASE_URL = 'https://txecbvvmpgxacrerewvy.supabase.co';
const SUPABASE_KEY = 'sb_publishable_als8xh6BeFLD0TA8nIMMPw_XMNuY84q';
const USUARIO = 'Diana2026';
const CLAVE   = 'Diana2026';
const IVA     = 0.19;

const CATS = {
  agua:        {ico:'💧', nom:'Agua'},
  gaseosa:     {ico:'🥤', nom:'Gaseosa'},
  cerveza:     {ico:'🍺', nom:'Cerveza'},
  licor:       {ico:'🥃', nom:'Licor / Alcohol'},
  jugo:        {ico:'🧃', nom:'Jugos'},
  energizante: {ico:'⚡', nom:'Energizante'},
  leche:       {ico:'🥛', nom:'Lácteos'},
  snacks:      {ico:'🍿', nom:'Snacks'},
  dulces:      {ico:'🍬', nom:'Dulces'},
  panaderia:   {ico:'🍞', nom:'Panadería'},
  mercado:     {ico:'🥫', nom:'Víveres'},
  aseo:        {ico:'🧼', nom:'Aseo'},
  otros:       {ico:'📦', nom:'Otros'}
};

/* ================== UTILIDADES ================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(n || 0);
const ico = c => (CATS[c] || CATS.otros).ico;
// El precio es FINAL (IVA incluido). Se desglosa hacia atrás: el total nunca cambia.
const desglose = total => { const base = Math.round(total / (1 + IVA)); return {base, iva: total - base, total}; };

function toast(msg, tipo){
  const el = document.createElement('div');
  el.className = 't ' + (tipo || '');
  el.textContent = msg;
  $('#toast').appendChild(el);
  setTimeout(() => el.remove(), tipo === 'err' ? 6000 : 2600);
}

async function api(path, o = {}){
  const headers = {apikey: SUPABASE_KEY, 'Content-Type': 'application/json'};
  if (o.prefer) headers.Prefer = o.prefer;
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, {
    method: o.method || 'GET', headers, body: o.body ? JSON.stringify(o.body) : undefined
  });
  const txt = await res.text();
  if (!res.ok){
    let m = txt; try { m = JSON.parse(txt).message || txt; } catch(e){}
    throw new Error(m || ('Error ' + res.status));
  }
  return txt ? JSON.parse(txt) : null;
}

/* ================== ESTADO ================== */
let productos = [], carrito = [], editId = null, catSel = 'otros', busqueda = '', busquedaP = '';

function guardarLocal(){
  try {
    localStorage.setItem('tdd_carrito', JSON.stringify({
      items: carrito, nombre: $('#cNombre').value, cedula: $('#cCedula').value
    }));
  } catch(e){}
}
function cargarLocal(){
  try {
    const d = JSON.parse(localStorage.getItem('tdd_carrito') || 'null');
    if (d){ carrito = d.items || []; $('#cNombre').value = d.nombre || ''; $('#cCedula').value = d.cedula || ''; }
  } catch(e){}
}
const getTienda = () => { try { return JSON.parse(localStorage.getItem('tdd_tienda') || '{}'); } catch(e){ return {}; } };

/* ================== LOGIN ================== */
function mostrarApp(){
  $('#login').hidden = true; $('#app').hidden = false;
  cargarLocal(); go('factura');
}
async function conectar(){
  productos = await api('productos?select=*&order=nombre.asc');
  sincronizarCarrito();
}
$('#formLogin').addEventListener('submit', async e => {
  e.preventDefault();
  const err = $('#lErr'); err.hidden = true;
  const u = $('#lUser').value.trim(), p = $('#lPass').value.trim();
  if (u !== USUARIO || p !== CLAVE){
    err.textContent = 'Usuario o contraseña incorrectos.'; err.hidden = false; return;
  }
  const b = $('#lBtn'); b.disabled = true; b.textContent = 'Conectando…';
  try {
    await conectar();
    sessionStorage.setItem('tdd_ok', '1');
    mostrarApp();
  } catch(ex){
    err.textContent = 'No se pudo conectar con la base de datos: ' + ex.message + '. Revisa que las tablas estén creadas en Supabase.';
    err.hidden = false;
  } finally { b.disabled = false; b.textContent = 'Entrar'; }
});
$('#btnSalir').addEventListener('click', () => {
  sessionStorage.removeItem('tdd_ok');
  $('#app').hidden = true; $('#login').hidden = false;
  $('#lUser').value = ''; $('#lPass').value = '';
});

/* ================== NAVEGACIÓN ================== */
function go(v){
  document.querySelectorAll('.view').forEach(s => s.hidden = s.id !== 'v-' + v);
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  if (v === 'factura'){ renderGrid(); renderCart(); }
  if (v === 'productos'){ renderCats(); renderLista(); prev(); }
  if (v === 'historial') cargarHistorial();
}
document.querySelectorAll('nav button').forEach(b => b.addEventListener('click', () => go(b.dataset.v)));

/* ================== FACTURACIÓN ================== */
function sincronizarCarrito(){
  carrito.forEach(it => {
    const p = productos.find(x => x.id === it.producto_id);
    if (p){ it.nombre = p.nombre; it.precio = p.precio; it.cat = p.categoria; }
  });
}
function renderGrid(){
  const q = busqueda.toLowerCase();
  const lista = productos.filter(p => p.nombre.toLowerCase().includes(q));
  if (!productos.length){
    $('#grid').innerHTML = '<div class="vacio" style="grid-column:1/-1">Aún no hay productos registrados.<br>Ve a la pestaña <b>Productos</b> para crear el primero.</div>';
    return;
  }
  if (!lista.length){ $('#grid').innerHTML = '<div class="vacio" style="grid-column:1/-1">Sin resultados.</div>'; return; }
  $('#grid').innerHTML = lista.map(p => {
    const n = carrito.filter(i => i.producto_id === p.id).reduce((a, i) => a + i.cantidad, 0);
    return `<button class="prod" data-add="${p.id}">
      ${n ? `<span class="badge">${n}</span>` : ''}
      <span class="ico">${ico(p.categoria)}</span>
      <div class="nom">${esc(p.nombre)}</div>
      <div class="pre">${fmt(p.precio)}</div></button>`;
  }).join('');
}
function renderCart(){
  const L = $('#lineas');
  if (!carrito.length){
    L.innerHTML = '<div class="vacio">La factura está vacía.<br>Toca un producto para agregarlo.</div>';
  } else {
    L.innerHTML = carrito.map((it, i) => {
      const existe = productos.some(p => p.id === it.producto_id);
      const opts = (existe ? '' : `<option value="${it.producto_id}" selected>${esc(it.nombre)}</option>`) +
        productos.map(p => `<option value="${p.id}" ${p.id === it.producto_id ? 'selected' : ''}>${esc(p.nombre)}</option>`).join('');
      return `<div class="linea">
        <div class="l-top"><span class="ico">${ico(it.cat)}</span>
          <select data-sw="${i}" title="Cambiar producto">${opts}</select>
          <button class="x" data-rm="${i}" title="Quitar">✕</button></div>
        <div class="l-bot">
          <div class="qty"><button data-q="${i}" data-d="-1">−</button><b>${it.cantidad}</b><button data-q="${i}" data-d="1">+</button></div>
          <span class="pu">${fmt(it.precio)} c/u</span>
          <b class="sub">${fmt(it.precio * it.cantidad)}</b></div></div>`;
    }).join('');
  }
  const total = carrito.reduce((a, i) => a + i.precio * i.cantidad, 0);
  const t = desglose(total);
  $('#totales').innerHTML = `
    <div><span>Base gravable</span><span>${fmt(t.base)}</span></div>
    <div><span>IVA 19%</span><span>${fmt(t.iva)}</span></div>
    <div class="big"><span>TOTAL</span><span>${fmt(t.total)}</span></div>
    <small>Los precios ya incluyen IVA. El total es exactamente la suma de tus precios.</small>`;
  guardarLocal();
}
function agregar(id){
  const p = productos.find(x => x.id === id); if (!p) return;
  const ex = carrito.find(i => i.producto_id === id);
  if (ex) ex.cantidad++;
  else carrito.push({producto_id: p.id, nombre: p.nombre, precio: p.precio, cat: p.categoria, cantidad: 1});
  renderGrid(); renderCart();
}
$('#grid').addEventListener('click', e => { const b = e.target.closest('[data-add]'); if (b) agregar(b.dataset.add); });
$('#buscar').addEventListener('input', e => { busqueda = e.target.value; renderGrid(); });
$('#lineas').addEventListener('click', e => {
  const rm = e.target.closest('[data-rm]');
  if (rm){ carrito.splice(+rm.dataset.rm, 1); renderGrid(); renderCart(); return; }
  const q = e.target.closest('[data-q]');
  if (q){
    const it = carrito[+q.dataset.q]; it.cantidad += +q.dataset.d;
    if (it.cantidad < 1) carrito.splice(+q.dataset.q, 1);
    renderGrid(); renderCart();
  }
});
$('#lineas').addEventListener('change', e => {
  const s = e.target.closest('[data-sw]'); if (!s) return;
  const p = productos.find(x => x.id === s.value); if (!p) return;
  const it = carrito[+s.dataset.sw];
  Object.assign(it, {producto_id: p.id, nombre: p.nombre, precio: p.precio, cat: p.categoria});
  renderGrid(); renderCart();
});
$('#cNombre').addEventListener('input', guardarLocal);
$('#cCedula').addEventListener('input', guardarLocal);

function vaciar(){
  carrito = []; $('#cNombre').value = ''; $('#cCedula').value = '';
  renderGrid(); renderCart();
}
$('#btnVaciar').addEventListener('click', () => {
  if (!carrito.length && !$('#cNombre').value && !$('#cCedula').value) return;
  if (confirm('¿Vaciar la factura actual?')) vaciar();
});

$('#btnGuardar').addEventListener('click', async () => {
  if (!carrito.length) return toast('Agrega al menos un producto', 'err');
  const nombre = $('#cNombre').value.trim() || 'Consumidor final';
  const cedula = $('#cCedula').value.trim() || null;
  const total = carrito.reduce((a, i) => a + i.precio * i.cantidad, 0);
  const t = desglose(total);
  const items = carrito.map(i => ({
    producto_id: productos.some(p => p.id === i.producto_id) ? i.producto_id : null,
    nombre: i.nombre, precio_unitario: i.precio, cantidad: i.cantidad, subtotal: i.precio * i.cantidad
  }));
  const b = $('#btnGuardar'); b.disabled = true; b.textContent = 'Guardando…';
  try {
    const [f] = await api('facturas', {method: 'POST', prefer: 'return=representation',
      body: {cliente_nombre: nombre, cliente_cedula: cedula, base_gravable: t.base, iva: t.iva, total: t.total}});
    try {
      await api('factura_items', {method: 'POST', prefer: 'return=minimal',
        body: items.map(x => ({...x, factura_id: f.id}))});
    } catch(ex){
      await api('facturas?id=eq.' + f.id, {method: 'DELETE'}).catch(() => {});
      throw ex;
    }
    vaciar();
    toast('Factura guardada', 'ok');
    mostrarRecibo({...f, items});
  } catch(ex){
    toast('No se pudo guardar: ' + ex.message, 'err');
  } finally { b.disabled = false; b.textContent = '✅ Guardar factura'; }
});

/* ================== PRODUCTOS ================== */
function renderCats(){
  $('#cats').innerHTML = Object.entries(CATS).map(([k, v]) =>
    `<button type="button" class="cat ${k === catSel ? 'on' : ''}" data-cat="${k}"><span>${v.ico}</span>${v.nom}</button>`).join('');
}
$('#cats').addEventListener('click', e => { const b = e.target.closest('[data-cat]'); if (b){ catSel = b.dataset.cat; renderCats(); } });
function prev(){
  const v = Math.round(+$('#pPrecio').value);
  if (!v || v < 0){ $('#pPrev').textContent = 'Escribe el precio para ver el desglose del IVA.'; return; }
  const t = desglose(v);
  $('#pPrev').innerHTML = `Base ${fmt(t.base)} + IVA 19% ${fmt(t.iva)} = <b>${fmt(t.total)}</b><br><small>Se cobrará exactamente ${fmt(t.total)}.</small>`;
}
$('#pPrecio').addEventListener('input', prev);

function renderLista(){
  const q = busquedaP.toLowerCase();
  const l = productos.filter(p => p.nombre.toLowerCase().includes(q));
  $('#pCont').textContent = productos.length ? `(${productos.length})` : '';
  if (!productos.length){ $('#lista').innerHTML = '<div class="vacio">No hay productos todavía.<br>Crea el primero con el formulario.</div>'; return; }
  if (!l.length){ $('#lista').innerHTML = '<div class="vacio">Sin resultados.</div>'; return; }
  $('#lista').innerHTML = l.map(p => `
    <div class="fila">
      <span class="ico">${ico(p.categoria)}</span>
      <div class="info"><b>${esc(p.nombre)}</b><small>${(CATS[p.categoria] || CATS.otros).nom}</small></div>
      <span class="pr">${fmt(p.precio)}</span>
      <button class="mini e" data-ed="${p.id}">✏️ Editar</button>
      <button class="mini d" data-del="${p.id}">🗑️</button>
    </div>`).join('');
}
$('#pBuscar').addEventListener('input', e => { busquedaP = e.target.value; renderLista(); });

function limpiarForm(){
  editId = null; catSel = 'otros';
  $('#pNombre').value = ''; $('#pPrecio').value = '';
  $('#pTitulo').textContent = '📦 Nuevo producto';
  $('#pGuardar').textContent = '💾 Guardar producto';
  $('#pCancel').hidden = true;
  renderCats(); prev();
}
$('#pCancel').addEventListener('click', limpiarForm);

$('#pGuardar').addEventListener('click', async () => {
  const nombre = $('#pNombre').value.trim();
  const precio = Math.round(+$('#pPrecio').value);
  if (!nombre) return toast('Escribe el nombre del producto', 'err');
  if (!(precio >= 0) || $('#pPrecio').value === '') return toast('Escribe un precio válido', 'err');
  const b = $('#pGuardar'); b.disabled = true;
  try {
    if (editId) await api('productos?id=eq.' + editId, {method: 'PATCH', prefer: 'return=minimal', body: {nombre, precio, categoria: catSel}});
    else await api('productos', {method: 'POST', prefer: 'return=minimal', body: {nombre, precio, categoria: catSel}});
    await conectar();
    toast(editId ? 'Producto actualizado' : 'Producto creado', 'ok');
    limpiarForm(); renderLista();
  } catch(ex){ toast('No se pudo guardar: ' + ex.message, 'err'); }
  finally { b.disabled = false; }
});

$('#lista').addEventListener('click', async e => {
  const ed = e.target.closest('[data-ed]');
  if (ed){
    const p = productos.find(x => x.id === ed.dataset.ed); if (!p) return;
    editId = p.id; catSel = CATS[p.categoria] ? p.categoria : 'otros';
    $('#pNombre').value = p.nombre; $('#pPrecio').value = p.precio;
    $('#pTitulo').textContent = '✏️ Editar producto';
    $('#pGuardar').textContent = '💾 Guardar cambios';
    $('#pCancel').hidden = false;
    renderCats(); prev(); window.scrollTo({top: 0, behavior: 'smooth'}); $('#pNombre').focus();
    return;
  }
  const del = e.target.closest('[data-del]');
  if (del){
    const p = productos.find(x => x.id === del.dataset.del); if (!p) return;
    if (!confirm(`¿Eliminar "${p.nombre}"?\nLas facturas ya guardadas no se modifican.`)) return;
    try {
      await api('productos?id=eq.' + p.id, {method: 'DELETE', prefer: 'return=minimal'});
      if (editId === p.id) limpiarForm();
      await conectar(); renderLista(); toast('Producto eliminado', 'ok');
    } catch(ex){ toast('No se pudo eliminar: ' + ex.message, 'err'); }
  }
});

/* ================== HISTORIAL ================== */
let facturas = [];
async function cargarHistorial(){
  $('#hLista').innerHTML = '<div class="vacio">Cargando…</div>';
  try {
    facturas = await api('facturas?select=*,factura_items(*)&order=creada_en.desc&limit=200');
    const hoy = new Date().toDateString();
    const deHoy = facturas.filter(f => new Date(f.creada_en).toDateString() === hoy);
    $('#hStat').innerHTML = `
      <div><small>Facturas de hoy</small><b>${deHoy.length}</b></div>
      <div><small>Vendido hoy</small><b>${fmt(deHoy.reduce((a, f) => a + f.total, 0))}</b></div>`;
    if (!facturas.length){ $('#hLista').innerHTML = '<div class="vacio">Todavía no hay facturas guardadas.</div>'; return; }
    $('#hLista').innerHTML = facturas.map(f => `
      <div class="fila">
        <span class="ico">🧾</span>
        <div class="info"><b>N° ${String(f.numero).padStart(5, '0')} · ${esc(f.cliente_nombre)}</b>
          <small>${new Date(f.creada_en).toLocaleString('es-CO', {dateStyle: 'medium', timeStyle: 'short'})}</small></div>
        <span class="pr">${fmt(f.total)}</span>
        <button class="mini e" data-ver="${f.id}">Ver</button>
      </div>`).join('');
  } catch(ex){
    $('#hLista').innerHTML = '<div class="vacio">No se pudo cargar: ' + esc(ex.message) + '</div>';
  }
}
$('#hLista').addEventListener('click', e => {
  const b = e.target.closest('[data-ver]'); if (!b) return;
  const f = facturas.find(x => x.id === b.dataset.ver); if (!f) return;
  mostrarRecibo({...f, items: f.factura_items || []});
});

/* ================== RECIBO / MODALES ================== */
function abrirModal(html){
  $('#modal').innerHTML = `<div class="modal-bg" id="mbg"><div class="modal-box">${html}</div></div>`;
  $('#mbg').addEventListener('click', e => { if (e.target.id === 'mbg') cerrarModal(); });
}
function cerrarModal(){ $('#modal').innerHTML = ''; }

function mostrarRecibo(f){
  const t = getTienda();
  const fecha = new Date(f.creada_en).toLocaleString('es-CO', {dateStyle: 'medium', timeStyle: 'short'});
  abrirModal(`
    <div class="receipt">
      <div class="r-head"><div style="font-size:30px">🛒</div><h3>La Tienda de Diana</h3>
        ${t.nit ? `<div>NIT: ${esc(t.nit)}</div>` : ''}${t.dir ? `<div>${esc(t.dir)}</div>` : ''}${t.tel ? `<div>Tel: ${esc(t.tel)}</div>` : ''}</div>
      <div class="r-meta">
        <div><b>Factura N°</b> ${String(f.numero).padStart(5, '0')}</div>
        <div>${fecha}</div>
        <div><b>Cliente:</b> ${esc(f.cliente_nombre)}</div>
        ${f.cliente_cedula ? `<div><b>Cédula:</b> ${esc(f.cliente_cedula)}</div>` : ''}
      </div>
      <table>
        <thead><tr><th>Producto</th><th class="n">Cant.</th><th class="n">V. unit.</th><th class="n">Total</th></tr></thead>
        <tbody>${f.items.map(i => `<tr><td>${esc(i.nombre)}</td><td class="n">${i.cantidad}</td><td class="n">${fmt(i.precio_unitario)}</td><td class="n">${fmt(i.subtotal)}</td></tr>`).join('')}</tbody>
      </table>
      <div class="r-tot">
        <div><span>Base gravable</span><span>${fmt(f.base_gravable)}</span></div>
        <div><span>IVA 19%</span><span>${fmt(f.iva)}</span></div>
        <div class="big"><span>TOTAL</span><span>${fmt(f.total)}</span></div>
      </div>
      <p class="r-foot">Precios con IVA incluido.<br>¡Gracias por su compra!</p>
    </div>
    <div class="m-acts no-print">
      <button class="btn ghost" onclick="cerrarModal()">Cerrar</button>
      <button class="btn blue" onclick="window.print()">🖨️ Imprimir</button>
    </div>`);
}

$('#btnTienda').addEventListener('click', () => {
  const t = getTienda();
  abrirModal(`
    <h2 style="color:var(--azul-osc);margin-bottom:4px">⚙️ Datos de la tienda</h2>
    <p style="color:var(--gris);font-size:14px">Aparecen en el encabezado de la factura. Se guardan solo en este equipo.</p>
    <label for="tNit">NIT</label><input id="tNit" value="${esc(t.nit || '')}">
    <label for="tDir">Dirección</label><input id="tDir" value="${esc(t.dir || '')}">
    <label for="tTel">Teléfono</label><input id="tTel" value="${esc(t.tel || '')}">
    <div class="m-acts">
      <button class="btn ghost" onclick="cerrarModal()">Cancelar</button>
      <button class="btn blue" id="tOk">Guardar</button>
    </div>`);
  $('#tOk').addEventListener('click', () => {
    localStorage.setItem('tdd_tienda', JSON.stringify({nit: $('#tNit').value.trim(), dir: $('#tDir').value.trim(), tel: $('#tTel').value.trim()}));
    cerrarModal(); toast('Datos guardados', 'ok');
  });
});

/* ================== INICIO ================== */
(async function(){
  if (sessionStorage.getItem('tdd_ok') === '1'){
    try { await conectar(); mostrarApp(); } catch(e){ sessionStorage.removeItem('tdd_ok'); }
  }
})();
</script>
</body>
</html>
